# Formatting, lint, type checks, binding drift and tests on every pull request
# and push to main. Runs on Apple Silicon macOS, the only supported target.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Line tables keep panic backtraces readable while shrinking the cache and
# speeding up linking of the debug and test binaries.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: make install

      # Tauri embeds the frontend at compile time, so the build output must
      # exist before any Cargo step. Committed bindings are enough for Vite.
      - name: Build frontend
        run: bunx vite build

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      # The package check and test scripts regenerate bindings first; CI
      # generates them once here and calls the underlying tools directly.
      - name: Verify bindings
        run: make bindings-check

      - name: Type-check
        run: |
          bunx svelte-kit sync
          bunx svelte-check --tsconfig ./tsconfig.json
          make desktop-check

      - name: Test
        run: |
          bun test
          make desktop-test
