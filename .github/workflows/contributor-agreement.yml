# Asks each pull request author to accept the Contributor Agreement once, then
# records the acceptance in a private signatures repository. The job never checks
# out pull request code, so running on pull_request_target is safe.
name: Contributor Agreement

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  contributor-agreement:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'recheck') ||
          contains(github.event.comment.body, 'I have read the isoboard Contributor Agreement isoboard-contributor-v1 and I accept it.')))
    steps:
      - name: Check acceptance
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with Contents read/write on the signatures repository only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CONTRIBUTOR_AGREEMENT_TOKEN }}
        with:
          remote-organization-name: carlesonielfa
          remote-repository-name: isoboard-contributor-signatures
          branch: main
          path-to-signatures: signatures/isoboard-contributor-v1.json
          # The tag is protected from updates and deletion, so it fixes the agreed text.
          path-to-document: https://github.com/carlesonielfa/isoboard-app/blob/isoboard-contributor-v1/CONTRIBUTOR-AGREEMENT.md
          custom-pr-sign-comment: I have read the isoboard Contributor Agreement isoboard-contributor-v1 and I accept it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can include it, each author
            needs to accept the [isoboard Contributor Agreement](https://github.com/carlesonielfa/isoboard-app/blob/isoboard-contributor-v1/CONTRIBUTOR-AGREEMENT.md)
            once, by posting the comment below. You keep ownership of your work. If an
            employer or organization owns rights in it, email legal@isoboard.app before
            accepting.
          custom-allsigned-prcomment: All authors have accepted the isoboard Contributor Agreement.
          signed-commit-message: 'Record $contributorName acceptance of isoboard-contributor-v1 (PR #$pullRequestNo)'
          create-file-commit-message: Create isoboard-contributor-v1 acceptance record
          allowlist: carlesonielfa,*[bot]
          lock-pullrequest-aftermerge: true
